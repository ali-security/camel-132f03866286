name: PR Build (Camel 4)

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional test selector passed to -Dtest/-Dit.test (empty runs the full suite)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        java: ['17']
        experimental: [ false ]
        include:
          - java: '21'
            experimental: true

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - id: install-packages
        uses: ./.github/actions/install-packages
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      # Sealed build: the full-repo regen (./etc/scripts/regen.sh) does not fit the fork's
      # time budget, so build only the affected projects and their dependencies, as
      # .github/actions/component-test/component-test.sh does (fast build, then tests).
      - name: maven build
        shell: bash
        run: |
          ./mvnw -B -V -e --no-transfer-progress -Dquickly install -pl core/camel-util,components/camel-tracing,components/camel-kafka -am
      # Sealed build: current runner Docker Engine rejects the old default API version of the
      # docker-java bundled with Testcontainers 1.20.1 ("Could not find a valid Docker environment").
      - name: Docker API compatibility for Testcontainers
        shell: bash
        run: |
          echo "api.version=1.44" > ~/.docker-java.properties
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nEnvironment=DOCKER_MIN_API_VERSION=1.24\n' | sudo tee /etc/systemd/system/docker.service.d/min-api.conf
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          docker version
      - name: mvn test
        shell: bash
        run: |
          OPTS="-B -V -e --no-transfer-progress -Dci.env.name=github.com -Dsurefire.rerunFailingTestsCount=2 -Dfailsafe.rerunFailingTestsCount=2 -Dformatter.skip -Dimpsort.skip -Dlicense.skip"
          PL="core/camel-util,components/camel-tracing,components/camel-kafka"
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./mvnw $OPTS install -pl "$PL" -Dtest="${{ inputs.test-filter }}" -Dit.test="${{ inputs.test-filter }}" -Dsurefire.failIfNoSpecifiedTests=false -Dfailsafe.failIfNoSpecifiedTests=false
          else
            ./mvnw $OPTS install -pl "$PL"
          fi
      - name: test summary
        if: always()
        shell: bash
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          tot = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          skips = {}
          for f in sorted(glob.glob("**/target/*-reports*/TEST-*.xml", recursive=True)):
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  continue
              for k in tot:
                  tot[k] += int(r.get(k, "0") or 0)
              for tc in r.iter("testcase"):
                  s = tc.find("skipped")
                  if s is not None:
                      reason = (s.get("message") or (s.text or "").strip() or "no message").splitlines()[0][:200]
                      skips.setdefault(reason, []).append(tc.get("classname", "") + "." + tc.get("name", ""))
          why = {
              "Requires Kafka 3.x": "upstream-disabled: the class carries two repeated @EnabledIfSystemProperty(named=kafka.instance.type) conditions (matches=local-kafka3-container AND matches=kafka); JUnit ANDs repeated conditions and a value cannot fully match both, so upstream never runs these auth ITs in any configuration",
              "bootstrapServers": "manual test by design (*ManualTest): needs an external SASL Kafka broker plus kafka.manual.test.topic/username/password credentials supplied by a developer",
          }
          print("=== Skipped tests by reason ===")
          for reason, names in sorted(skips.items()):
              note = next((v for k, v in why.items() if k in reason), "")
              print(f"SKIPPED ({len(names)}) reason: {reason}" + (f" [{note}]" if note else "") + ": " + ", ".join(sorted(set(names)))[:1500])
          passed = tot["tests"] - tot["failures"] - tot["errors"] - tot["skipped"]
          print(f"=== TOTAL (surefire+failsafe reports): tests={tot['tests']} passed={passed} failures={tot['failures']} errors={tot['errors']} skipped={tot['skipped']} ===")
          EOF
      # The public 4.8.5 jar was released with JDK 21 (Build-Jdk-Spec: 21, --release 17); ship the JDK 21 leg's jar.
      - name: upload camel-kafka jar
        if: matrix.java == '21'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: camel-kafka-jar
          path: components/camel-kafka/target/camel-kafka-4.8.5.jar
          if-no-files-found: error
